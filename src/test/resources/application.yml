spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        show_sql: false
    open-in-view: false
  flyway:
    enabled: false               # 테스트는 H2 + Hibernate create-drop 사용, Flyway(MySQL DDL) 미적용
  data:
    redis:
      host: localhost            # Lettuce는 지연 연결 — 컨텍스트 로드에 Redis 서버가 필요 없다
      port: 6379
      timeout: 300ms
      connect-timeout: 300ms

decorator:
  datasource:
    p6spy:
      enable-logging: false

app:
  frontend-url: http://localhost:3000

view-surge:
  window: 10s
  threshold: 200
  sustain-threshold: 100
  tracking-ttl: 5m
  extension: 5m
  grace: 15s
  sample-cache-max-size: 1000
  sample-cache-ttl: 35s
  routing-cache-max-size: 1000
  cleanup-batch-size: 100
  routing-refresh-interval: 3s
  flush-interval: 3s
  cleanup-interval: 10s

popularity:
  default-promotion-score: 100
  default-like-gate: 5
  default-comment-gate: 3
  score-like-weight: 3
  score-comment-weight: 2
  score-view-weight: 1
  promotion-window: 48h
  policy-sample-window: 7d
  policy-percentile: 0.98
  policy-min-sample-size: 100
  policy-smoothing-ratio: 0.30
  policy-cache-refresh-interval: 1m
  v1-scan-interval: 1m
  baseline-scan-enabled: false
  scan-chunk-size: 1000
  candidate-recheck-interval: 30s
  candidate-batch-size: 500
  finalization-interval: 30s
  finalization-batch-size: 500
  experiment-endpoints-enabled: false
  benchmark-token: ""

certification:
  provider-mode: STUB
  provider-base-url: http://127.0.0.1:19091
  service-key: test-key
  experiment-endpoints-enabled: false
  benchmark-token: ""

aws:
  region: ap-northeast-2
  s3:
    bucket: test-bucket
    endpoint: http://localhost:4566

oauth2:
  kakao:
    client-id: test
    client-secret: test
    redirect-uri: http://localhost:8080/oauth2/kakao/callback
  google:
    client-id: test
    client-secret: test
    redirect-uri: http://localhost:8080/oauth2/google/callback
